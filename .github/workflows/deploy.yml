name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one that has started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets live only in this environment: deploys from main only, each run approved by the owner.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test before deploying
        run: pnpm test

      # Migrations run before the new code, so the code can rely on the schema. They must stay
      # backward compatible with the code currently live (add, never rename or drop in one step).
      # D1 Time Travel allows point-in-time restore if a migration goes wrong.
      - name: Apply D1 migrations, then deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: |
            d1 migrations apply DB --remote
            deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://login.2earl.com/healthz | grep -q '"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://login.2earl.com/healthz did not become healthy"
          exit 1
