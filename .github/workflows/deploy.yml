name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one that has started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets live only in this environment: deploys from main only, each run approved by the owner.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test before deploying
        run: pnpm test

      # Migrations run before the new code, so the code can rely on the schema. They must stay
      # backward compatible with the code currently live (add, never rename or drop in one step).
      # D1 Time Travel allows point-in-time restore if a migration goes wrong.
      - name: Apply D1 migrations, then deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # Uploaded with `wrangler secret bulk` before the commands below run.
          secrets: |
            GOOGLE_CLIENT_SECRET
            SESSION_PEPPER
            CONSENT_REMEMBER_SECRET
            MFA_ENCRYPTION_KEY
            OWNER_GOOGLE_SUB
            OIDC_SIGNING_KEY
          command: |
            d1 migrations apply DB --remote
            deploy
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          CONSENT_REMEMBER_SECRET: ${{ secrets.CONSENT_REMEMBER_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          OWNER_GOOGLE_SUB: ${{ secrets.OWNER_GOOGLE_SUB }}
          OIDC_SIGNING_KEY: ${{ secrets.OIDC_SIGNING_KEY }}

      # Microsoft, GitHub and Apple sign-in (DESIGN §4.14, docs/PROVIDERS.md): their secrets are
      # optional, so they aren't in the required list above. Each is uploaded only when its GitHub
      # secret is set (GitHub reserves the GITHUB_ prefix, hence GH_OAUTH_CLIENT_SECRET). A
      # provider stays off until both its client ID (wrangler.jsonc) and its secret exist.
      - name: Upload optional sign-in provider secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          node -e '
            const names = ["MICROSOFT_CLIENT_SECRET", "GITHUB_CLIENT_SECRET", "APPLE_PRIVATE_KEY"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("node:fs").writeFileSync("optional-secrets.json", JSON.stringify(set), { mode: 0o600 });
            console.log("Optional secrets to upload:", Object.keys(set).join(", ") || "none");
          '
          if [ "$(cat optional-secrets.json)" != "{}" ]; then
            pnpm exec wrangler secret bulk optional-secrets.json
          fi
          rm -f optional-secrets.json

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://login.2earl.com/healthz | grep -q '"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://login.2earl.com/healthz did not become healthy"
          exit 1
