name: infra

# Terraform for infra/, run here; HCP Terraform keeps only the state (workspace in local execution
# mode). Changes are planned from main and applied only after the owner approves, twice: once to
# plan, once to apply what the plan showed.

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

# One Terraform run at a time; never cancel one that has started.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

defaults:
  run:
    working-directory: infra

jobs:
  # Any branch, no secrets: formatting and validation.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # main only. The plan is written to the run's summary for review before approving the apply.
  plan:
    name: plan
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Secrets live only in this environment: main only, each run approved by the owner.
    environment: production
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform init
      - id: plan
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "digest=$(terraform show -json tfplan | jq -cS '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, actions: .change.actions, after: .change.after}]' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # Applies only a plan identical to the one reviewed above; otherwise stops.
  apply:
    name: apply
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -out=tfplan
      - name: Same plan as reviewed
        env:
          REVIEWED: ${{ needs.plan.outputs.digest }}
        run: |
          now=$(terraform show -json tfplan | jq -cS '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, actions: .change.actions, after: .change.after}]' | sha256sum | cut -d' ' -f1)
          if [ "$now" != "$REVIEWED" ]; then
            echo "::error::The plan changed since it was reviewed. Run the workflow again."
            exit 1
          fi
      - run: terraform apply tfplan
